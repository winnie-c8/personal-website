<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 100" preserveAspectRatio="none">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComposite in="mono" in2="SourceGraphic" operator="in" result="speckle"/>
      <feBlend in="SourceGraphic" in2="speckle" mode="soft-light"/>
    </filter>
    <radialGradient id="pad-fill" cx="30%" cy="70%" r="80%">
      <stop offset="0" stop-color="#f1ee8c"/>
      <stop offset="0.45" stop-color="#7cc25a"/>
      <stop offset="1" stop-color="#2f8a3e"/>
    </radialGradient>
  </defs>
  <path transform="scale(1.7 1)" d="M50 50 L50 4 A46 46 0 1 0 73 10.2 Z" fill="url(#pad-fill)" filter="url(#grain)"/>
</svg>
